<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Levels</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="levels-page">

    <div class="levels-container">

        <h1 id="welcomeText">اختر المرحلة 🎮</h1>

        <div class="levels-list">

            <button class="level-card" data-level="1">

                <div class="level-icon">
                    🏆
                </div>

                <div class="level-info">
                    <h2>محترف</h2>
                    <p>جمع وطرح</p>
                </div>

                <div class="level-status" id="status1">
                    ⭐
                </div>

            </button>


            <button class="level-card" data-level="2">

                <div class="level-icon">
                    ⭐
                </div>

                <div class="level-info">
                    <h2>متميز</h2>
                    <p>الضرب</p>
                </div>

                <div class="level-status" id="status2">
                    🔒
                </div>

            </button>


            <button class="level-card" data-level="3">

                <div class="level-icon">
                    ⭐
                </div>

                <div class="level-info">
                    <h2>خبير</h2>
                    <p>معادلات وتفكير</p>
                </div>

                <div class="level-status" id="status3">
                    🔒
                </div>

            </button>


            <button class="level-card" data-level="4">

                <div class="level-icon">
                    ⭐
                </div>

                <div class="level-info">
                    <h2>أسطورة</h2>
                    <p>التحدي النهائي</p>
                </div>

                <div class="level-status" id="status4">
                    🔒
                </div>

            </button>

        </div>

    </div>

    <script src="levels.js"></script>

</body>
</html>
